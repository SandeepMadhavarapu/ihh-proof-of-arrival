name: Bootstrap Profile Factory

on:
  push:
    branches: [feat/profile-factory]
    paths: [.profile-factory-bootstrap.ready]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and unpack reviewed change set
        shell: bash
        run: |
          set -euo pipefail
          cat .profile-factory-bootstrap.part-* | base64 -d > /tmp/profile-factory-changes.tar.gz
          echo '694bcaa28c8851fd0c1236c85489559cfd09c7c5faa3905134f782cc9f700fa9  /tmp/profile-factory-changes.tar.gz' | sha256sum -c -
          tar -xzf /tmp/profile-factory-changes.tar.gz
          rm -f .profile-factory-bootstrap.part-* .profile-factory-bootstrap.ready
          rm -f .github/workflows/bootstrap-profile-factory.yml
      - name: Commit implementation to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add build-time Profile Factory'
          git push origin HEAD:feat/profile-factory
